[project]
name = "catalogforge"
version = "0.1.0"
description = "Evidence-backed product catalog enrichment"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2", "pgvector>=0.3.6,<1",
  "langchain>=1.0,<2", "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.0,<2", "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4", "procrastinate>=3.0,<4",
  "pypdf>=5.3,<7", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "reportlab>=4.3,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/catalogforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["apps/api/catalogforge"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
