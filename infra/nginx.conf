server {
  listen 80;
  client_max_body_size 20m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
  location /pdfjs/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
