name: catalogforge
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: catalogforge
      POSTGRES_USER: catalogforge
      POSTGRES_PASSWORD: catalogforge-local
    ports: ["127.0.0.1:5488:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogforge"]
      interval: 3s
      timeout: 3s
      retries: 20
  init:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: [{path: .env, required: false}]
    environment: &env
      DATABASE_URL: postgresql+psycopg://catalogforge:catalogforge-local@db:5432/catalogforge
      STORAGE_ROOT: /data/uploads
    volumes: ["uploads:/data/uploads"]
    command: ["uv", "run", "--no-sync", "python", "-m", "catalogforge.cli", "init"]
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: [{path: .env, required: false}]
    environment: *env
    volumes: ["uploads:/data/uploads"]
    command: ["uv", "run", "--no-sync", "uvicorn", "catalogforge.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8188:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: [{path: .env, required: false}]
    environment: *env
    volumes: ["uploads:/data/uploads"]
    command: ["uv", "run", "--no-sync", "python", "-m", "catalogforge.worker"]
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    ports: ["127.0.0.1:5288:80"]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
volumes:
  postgres:
  uploads:
